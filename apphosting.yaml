# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Define remote build steps for Firebase App Hosting
# See: https://firebase.google.com/docs/app-hosting/configure#build-steps
build:
  steps:
    - name: fetch
      artifactId: app-source
    - name: install
      inputArtifactId: app-source
      env:
        - variable: NPM_CONFIG_FETCH_RETRY_MINTIMEOUT
          value: "20000"
        - variable: NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT
          value: "120000"
        - variable: NPM_CONFIG_FETCH_RETRIES
          value: "5"
        - variable: NPM_CONFIG_FETCH_RETRY_FACTOR
          value: "10"
        - variable: NPM_CONFIG_MAXSOCKETS
          value: "15"
      commands:
        - npm ci --no-audit --no-fund || (sleep 5 && npm ci --no-audit --no-fund) || (sleep 10 && npm ci --no-audit --no-fund)
    - name: build
      inputArtifactId: app-source
      commands:
        - NODE_OPTIONS=--max-old-space-size=6144 npm run build